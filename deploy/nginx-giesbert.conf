# /etc/nginx/sites-available/giesbert
#
# Schritt 1: So wie hier (nur Port 80) aktivieren, dann
#   sudo certbot --nginx -d giesbert.svetho.net
# Certbot ergänzt die HTTPS-Einstellungen und die Umleitung von http auf https selbst.
# HTTPS ist Pflicht: Ohne HTTPS laufen Service Worker (Offline, Installieren) nicht.

server {
    listen 80;
    listen [::]:80;
    server_name giesbert.svetho.net;

    # Passwortschutz für die ganze Seite (die Daten liegen jetzt auf dem Server)
    auth_basic           "Giesbert";
    auth_basic_user_file /etc/nginx/htpasswd-giesbert;

    # Let's Encrypt muss die Bestätigungsdatei ohne Passwort abrufen können
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Eigene Fotos werden im Browser verkleinert, etwas Luft schadet nicht
    client_max_body_size 10m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # connect-src erlaubt die Online-Namenssuche bei GBIF; Bilder kommen vom eigenen Server
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.gbif.org; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        proxy_pass         http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Die Bildsuche bei Wikipedia kann ein paar Sekunden dauern
        proxy_read_timeout 60s;
    }
}
