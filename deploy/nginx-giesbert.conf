# /etc/nginx/sites-available/giesbert
#
# Schritt 1: So wie hier (nur Port 80) aktivieren, dann
#   sudo certbot --nginx -d giesbert.svetho.net
# Certbot ergänzt die HTTPS-Einstellungen und die Umleitung von http auf https selbst.
# HTTPS ist Pflicht: Ohne HTTPS laufen Service Worker (Offline, Installieren) nicht.

server {
    listen 80;
    listen [::]:80;
    server_name giesbert.svetho.net;

    # Nur der Ordner public/ ist von außen sichtbar (nicht .git/ oder deploy/)
    root  /var/www/giesbert/public;
    index index.html;

    # Optionaler Passwortschutz – siehe README, Abschnitt „Passwortschutz“
    # auth_basic           "Giesbert";
    # auth_basic_user_file /etc/nginx/htpasswd-giesbert;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # "no-cache" heißt: Browser fragt bei jedem Laden kurz nach, ob es eine neue Fassung gibt (Updates kommen sofort an)
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # connect-src erlaubt die Online-Namenssuche bei GBIF
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.gbif.org; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
